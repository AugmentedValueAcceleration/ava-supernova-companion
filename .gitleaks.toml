# Ava Supernova Companion — secret-scan config.
# Extends the default gitleaks ruleset and allowlists the false positives
# vetted in the full-history audit (May 2026). A new, real secret still trips
# the scan; these entries only silence known-benign matches.
title = "ava-supernova-companion secret scan"

[extend]
useDefault = true

[allowlist]
description = "Vetted false positives — full-history gitleaks audit, May 2026"
regexes = [
  '''znhqolmxbfmolatxcbph''',   # anon key (public-by-design) for a defunct prototype project, present in history
]
